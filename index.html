<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COP3502C Blackjack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0e12;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
    }
    .stats-bar span { display: block; font-weight: 700; font-size: 1.1rem; color: #f8fafc; }
    .terminal-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      height: 380px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #a5f3fc;
      white-space: pre-wrap;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    button.alt-btn { background: #334155; }
    button.alt-btn:hover:not(:disabled) { background: #475569; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Blackjack Simulator</h1>
      <span style="font-size: 0.8rem; color: #94a3b8;">COP3502C Project 1</span>
    </header>

    <div class="stats-bar">
      <div>Player Wins<span id="stat-p-wins">0</span></div>
      <div>Dealer Wins<span id="stat-d-wins">0</span></div>
      <div>Ties<span id="stat-ties">0</span></div>
      <div>Total Games<span id="stat-games">0</span></div>
    </div>

    <div class="terminal-box" id="terminal"></div>

    <div class="actions">
      <button id="btn-hit" onclick="handleOption(1)">1. Get another card</button>
      <button id="btn-hold" onclick="handleOption(2)">2. Hold hand</button>
      <button id="btn-stats" class="alt-btn" onclick="handleOption(3)">3. Print statistics</button>
      <button id="btn-new" class="alt-btn" onclick="startNewGame()">New Game</button>
    </div>
  </div>

  <script>
    // State variables matching python script
    let playerHand = 0;
    let playerWins = 0;
    let dealerWins = 0;
    let ties = 0;
    let numberOfGames = 0;
    let gameActive = false;

    const term = document.getElementById("terminal");

    function log(text = "") {
      term.textContent += text + "\n";
      term.scrollTop = term.scrollHeight;
    }

    function getRandomCard() {
      return Math.floor(Math.random() * 13) + 1;
    }

    function parseCard(cardNum) {
      if (cardNum === 1) return { name: "ACE", value: 1 };
      if (cardNum >= 2 && cardNum <= 10) return { name: cardNum.toString(), value: cardNum };
      if (cardNum === 11) return { name: "JACK", value: 10 };
      if (cardNum === 12) return { name: "QUEEN", value: 10 };
      if (cardNum === 13) return { name: "KING", value: 10 };
    }

    function updateStatsUI() {
      document.getElementById("stat-p-wins").textContent = playerWins;
      document.getElementById("stat-d-wins").textContent = dealerWins;
      document.getElementById("stat-ties").textContent = ties;
      document.getElementById("stat-games").textContent = numberOfGames;
    }

    function setButtonsState(active) {
      document.getElementById("btn-hit").disabled = !active;
      document.getElementById("btn-hold").disabled = !active;
      document.getElementById("btn-new").disabled = active;
    }

    function startNewGame() {
      numberOfGames += 1;
      playerHand = 0;
      gameActive = true;
      updateStatsUI();
      setButtonsState(true);

      log(`\nSTART GAME #${numberOfGames}`);
      const rawCard = getRandomCard();
      const card = parseCard(rawCard);
      playerHand += card.value;

      log(`Your card is a ${card.name}!`);
      log(`Your hand is ${playerHand}\n`);
      log("Choose an option below:");
    }

    function handleOption(choice) {
      if (choice === 1 && gameActive) {
        const rawCard = getRandomCard();
        const card = parseCard(rawCard);
        playerHand += card.value;

        log(`\nYour card is a ${card.name}!`);
        log(`Your hand is ${playerHand}`);

        if (playerHand > 21) {
          log("You exceeded 21! You lose.\n");
          dealerWins += 1;
          gameActive = false;
          setButtonsState(false);
        } else if (playerHand === 21) {
          log("BLACKJACK! You win!\n");
          playerWins += 1;
          gameActive = false;
          setButtonsState(false);
        }
        updateStatsUI();
      } 
      else if (choice === 2 && gameActive) {
        // Dealer draws random between 16 and 26
        const dealerHand = Math.floor(Math.random() * 11) + 16;
        log(`\nDealer's hand: ${dealerHand}`);
        log(`Your hand is: ${playerHand}`);

        if (dealerHand > 21) {
          log("You win!\n");
          playerWins += 1;
        } else if (dealerHand === 21) {
          log("You lose!\n");
          dealerWins += 1;
        } else if (dealerHand === playerHand) {
          log("Its a tie! No one wins!\n");
          ties += 1;
        } else if (dealerHand < playerHand) {
          log("You win!\n");
          playerWins += 1;
        } else {
          log("You lose!\n");
          dealerWins += 1;
        }
        gameActive = false;
        setButtonsState(false);
        updateStatsUI();
      } 
      else if (choice === 3) {
        log(`\nNumber of Player wins: ${playerWins}`);
        log(`Number of Dealer wins: ${dealerWins}`);
        log(`Number of tie games: ${ties}`);
        log(`Total # of games played is: ${numberOfGames}`);
        const pct = numberOfGames > 0 ? ((playerWins / numberOfGames) * 100).toFixed(1) : "0.0";
        log(`Percentage of Player wins: ${pct}%\n`);
      }
    }

    // Auto-start on load
    startNewGame();
  </script>
</body>
</html>
